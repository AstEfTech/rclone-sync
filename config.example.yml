# Copy to config.yml in the repository root, fill it in, and only then run
# deploy.sh:
#   cp config.example.yml config.yml
# Each provider is deployed from the `common` block and its own block under `providers`,
# so the settings of providers you do not use can stay as they are.
# Nothing secret lives here: credentials stay in rclone.conf of the run user.
# Indent with 2 spaces (no tabs); lists and multi-line values are not supported.

# Defaults for every provider; any key can be overridden in a provider block
common:
  # User that rclone, the scripts and the systemd units run as (not root)
  run_user: rclone_user

  # Optional: mount point of a separate disk. If set, dst_dir must be inside it and
  # each run is skipped while it is not mounted. Leave out (or empty) for a plain directory.
  mount_point: /mnt/storage
  # Optional: a run is skipped when less than this many GB are free. Default: 5.
  min_free_gb: 5

  # Optional: when to run, a systemd OnCalendar expression (check with
  # `systemd-analyze calendar "<expr>"`). Default: every 15 minutes.
  # Keep the quotes: a bare * is not valid YAML.
  schedule: "*:0/15"

  # Optional: logs older than this many days are deleted. Default: 14.
  keep_log_days: 14

  # Where deploy.sh installs the providers: <app_dir>/<provider>-pull/
  # holds the script, a generated .env, .lock and log/
  app_dir: /home/rclone_user

providers:
  # Google Drive (./deploy.sh gdrive)
  gdrive:
    # Source: remote from rclone.conf and a folder on it
    src_remote: gdrive:SomeDir

    # Destination on the local disk (inside mount_point)
    dst_dir: /mnt/storage/gdrive

  # iCloud Drive (./deploy.sh icloud)
  icloud:
    # Source: remote from rclone.conf and a folder on it
    # (for iCloud Photos use a remote created with service=photos,
    # e.g. icloudphotos:PrimarySync/Favorites)
    src_remote: icloud:SomeDir

    # Destination on the local disk (inside mount_point)
    dst_dir: /mnt/storage/icloud

    # Optional overrides of the common block, for this provider only:
    # schedule: "hourly"
    # min_free_gb: 10
    # keep_log_days: 30
    # run_user: other_user
    # mount_point: /mnt/other
    # app_dir: /home/other_user
