# Copy to config.yml in the repository root, fill it in, and only then run
# deploy.sh:
#   cp config.example.yml config.yml
# Each provider is deployed from the `common` block and its own block under `providers`,
# so the settings of providers you do not use can stay as they are.
# Nothing secret lives here: credentials stay in rclone.conf of the run user.
# Indent with 2 spaces (no tabs); lists and multi-line values are not supported,
# which is why folder pairs are named blocks (see `pairs` below).

# Defaults for every provider; any key can be overridden in a provider block
common:
  # User that rclone, the scripts and the systemd units run as (not root)
  run_user: rclone_user

  # Optional: mount point of a separate disk. If set, every dst must be inside it and
  # each run is skipped while it is not mounted. Leave out (or empty) for a plain directory.
  mount_point: /mnt/storage
  # Optional: a pair is skipped when less than this many GB are free. Default: 5.
  min_free_gb: 5

  # Optional: default sync type of the pairs (copy | sync | move), see `providers` below.
  # Can be overridden per provider and per pair. Default: copy.
  mode: copy

  # Optional: when to run, a systemd OnCalendar expression (check with
  # `systemd-analyze calendar "<expr>"`). Default: every 15 minutes.
  # Keep the quotes: a bare * is not valid YAML.
  schedule: "*:0/15"

  # Optional: logs older than this many days are deleted. Default: 14.
  keep_log_days: 14

  # Where deploy.sh installs the providers: <app_dir>/<provider>-pull/
  # holds the script, a generated .env, .lock and log/
  app_dir: /home/rclone_user

providers:
  # Each provider syncs one or more folder pairs: a source on the remote and a
  # destination on the local disk. Pairs run one after another; a failing pair does not
  # stop the others. The pair name (media, documents, ...) is a label of letters,
  # digits, - and _.
  #
  # Sync type (`mode`; the pair's own value wins, then the provider block, then common,
  # then copy):
  #   copy  copy new and changed files, never delete anything (safe default)
  #   sync  make dst an exact mirror of src: files missing in src are DELETED from dst
  #   move  copy, then delete the files from src (the source gets emptied!)
  # Destinations of different pairs must not overlap (the same dir or one inside another).

  # Google Drive (./deploy.sh gdrive)
  gdrive:
    pairs:
      media:
        # Source: remote from rclone.conf and a folder on it
        src: gdrive:Media
        # Destination on the local disk (inside mount_point)
        dst: /mnt/storage/gdrive/media
        mode: copy

  # iCloud Drive (./deploy.sh icloud)
  icloud:
    pairs:
      files:
        src: icloud:SomeDir
        dst: /mnt/storage/icloud/files
        mode: copy

      # iCloud Photos: a separate remote created with service=photos (read-only),
      # see icloud/CONNECTION_README.md
      photos:
        src: icloudphotos:PrimarySync/Favorites
        dst: /mnt/storage/icloud/photos
        # no mode: the default from the common block (copy) applies

    # Optional overrides of the common block, for this provider only:
    # mode: sync
    # schedule: "hourly"
    # min_free_gb: 10
    # keep_log_days: 30
    # run_user: other_user
    # mount_point: /mnt/other
    # app_dir: /home/other_user
