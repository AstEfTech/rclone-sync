# Provider settings shared by deploy.sh and the pull script (not secret, tracked by git)

# Prefix of the installed script and systemd units: <NAME>-pull.{sh,service,timer}
NAME=icloud

# Used in the systemd unit description
DESCRIPTION="iCloud Drive"

# Minimum rclone version checked by deploy.sh (the iclouddrive backend appeared in 1.69)
MIN_RCLONE_VERSION=1.69

# Provider-specific rclone options; fewer parallel operations than for Google Drive:
# the iCloud API is stricter about request rates
RCLONE_ARGS=(--transfers 2 --checkers 4)

# 1 = on a failed run, hint to reauthenticate with rclone config reconnect (30-day trust token)
RECONNECT_ON_ERROR=1
