# Provider settings shared by deploy.sh and the pull script (not secret, tracked by git)

# Prefix of the installed script and systemd units: <NAME>-pull.{sh,service,timer}
NAME=gphotos

# Used in the systemd unit description
DESCRIPTION="Google Photos"

# Minimum rclone version checked by deploy.sh (empty = no check)
MIN_RCLONE_VERSION=

# Provider-specific rclone options; the Photos API is slow and rate limited
RCLONE_ARGS=(--transfers 2 --checkers 4)

# 1 = on a failed run, hint to reauthenticate with rclone config reconnect
RECONNECT_ON_ERROR=0
